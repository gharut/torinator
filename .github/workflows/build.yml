name: Build Windows executable
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - shell: pwsh
        run: ./build.ps1
      - name: Verify isolated Windows enforcement and crash recovery
        shell: pwsh
        env:
          TORINATOR_PROTECTION_TEST: '1'
        run: go test ./internal/protection -run '^TestNative' -count=1 -timeout 90s -v
      - uses: actions/upload-artifact@v4
        with:
          name: torinator-windows-amd64
          path: |
            dist/torinator.exe
            dist/THIRD_PARTY_NOTICES.md
            dist/README.md
            dist/build-info.json
